[tool.briefcase]
project_name = "LifeOS"
bundle = "life.lifeos"
version = "0.6.0"
url = "https://lifeos-diary.netlify.app"
license = "LicenseRef-LifeOS-NonCommercial"
license-files = ["../LICENSE.md"]
author = "LifeOS Contributors"
author_email = ""

[tool.briefcase.app.lifeosmobile]
formal_name = "LifeOS"
description = "Private offline journal and living archive"
sources = ["src/lifeosmobile"]
test_sources = ["tests"]
requires = ["certifi==2026.10.19", "qrcode==8.2"]
permission.camera = "为未来的自己录制漂流瓶视频或拍摄附件"
permission.microphone = "为未来的自己录制漂流瓶语音"
permission.photo_library = "选择要保存在日记中的照片与视频"

[tool.briefcase.app.lifeosmobile.android]
requires = ["toga-android==0.5.7", "cryptography==42.0.8", "Pillow==11.0.0"]
version_code = 600
build_gradle_dependencies = [
    "androidx.appcompat:appcompat:1.7.1",
    "androidx.constraintlayout:constraintlayout:2.2.1",
    "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0",
    "androidx.webkit:webkit:1.15.0",
]
build_gradle_extra_content = """
chaquopy.defaultConfig.staticProxy("toga_android.widgets.internal.webview", "lifeosmobile.android_web")
"""
manifest_application_extra_content = 'android:usesCleartextTraffic="true"'

[tool.briefcase.app.lifeosmobile.iOS]
requires = ["toga-iOS==0.5.7", "cryptography==47.0.0", "Pillow==13.0.0"]
supported = true
info.NSAppTransportSecurity.NSAllowsLocalNetworking = true
info.NSLocalNetworkUsageDescription = "连接你在设置中指定的局域网 AI 或同步服务"
info.UIFileSharingEnabled = false
info.LSSupportsOpeningDocumentsInPlace = true

