<!doctype html><meta charset="utf-8"><style>
html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden;user-select:none}.stage{position:absolute;inset:0}.sprite{width:192px;height:208px;background-repeat:no-repeat;cursor:grab;touch-action:none;transition:none;contain:layout paint}.sprite.dragging{cursor:grabbing}
</style><div class="stage"><div id="pet" class="sprite" role="button" tabindex="0" aria-label="可拖动桌宠；按 Enter 挥手，右键打开菜单"></div></div><script>
const petBridge=window.lifeosPet;const params=new URLSearchParams(location.search);let initialMeta=null,meta=null;try{initialMeta=JSON.parse(params.get('pet')||'null')}catch{try{initialMeta=JSON.parse(decodeURIComponent(params.get('pet')||'null'))}catch{}}const root=document.getElementById('pet');let configuredSprite='',configSequence=0;
const ROW={idle:0,'running-right':1,'running-left':2,waving:3,jumping:4,failed:5,waiting:6,running:7,review:8};let state='idle',frame=0,timer=null,until=0,look=-1,drag=null;
const isV2=()=>Number(meta?.version)===2;const standardState=s=>ROW[s]===undefined?'idle':s;
function setState(next,ms=0){state=standardState(next);look=-1;frame=0;until=ms?Date.now()+ms:0;renderSprite()}
function renderSprite(){if(!meta){root.style.backgroundImage='';return}const rows=isV2()?11:9,usingLook=isV2()&&look>=0,row=usingLook?9+Math.floor(look/8):ROW[state],cells=meta.frameMap?.[row]||[0,1,2,3,4,5,6,7],column=usingLook?look%8:cells[frame%cells.length],url=meta.sprite;if(configuredSprite!==url||root.dataset.rows!==String(rows)){root.style.backgroundImage=`url("${url}")`;root.style.backgroundSize=`${8*192}px ${rows*208}px`;root.dataset.rows=String(rows);configuredSprite=url}root.style.backgroundPosition=`-${column*192}px -${row*208}px`;}
function loop(){if(!drag&&until&&Date.now()>=until)setState('idle');else if(!isV2()||look<0)frame+=1;renderSprite();timer=setTimeout(loop,state==='waiting'?240:140)}
function populatedFrames(image,version){const rows=Number(version)===2?11:9,canvas=document.createElement('canvas');canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;const context=canvas.getContext('2d',{willReadFrequently:true});context.drawImage(image,0,0);const w=Math.floor(canvas.width/8),h=Math.floor(canvas.height/rows);return Array.from({length:rows},(_,row)=>{const cells=[];for(let column=0;column<8;column++){const pixels=context.getImageData(column*w,row*h,w,h).data;for(let i=3;i<pixels.length;i+=4){if(pixels[i]){cells.push(column);break}}}return cells.length?cells:[0]})}
async function applyConfig(next){const sequence=++configSequence;if(!next?.sprite)return;try{const image=new Image();image.src=next.sprite;await image.decode();if(sequence!==configSequence)return;next={...next,frameMap:populatedFrames(image,next.version)};meta=next;frame=0;look=-1;renderSprite();delete root.dataset.loadError;if(!timer)timer=setTimeout(loop,140);petBridge?.ready?.()}catch{root.dataset.loadError='true'}}
function pointLook(event){if(!isV2()||drag)return;const r=root.getBoundingClientRect(),dx=event.clientX-r.left-r.width/2,dy=event.clientY-r.top-r.height/2;if(Math.hypot(dx,dy)<16){look=-1}else{look=Math.round((Math.atan2(dx,-dy)*180/Math.PI+360)%360/22.5)%16}renderSprite()}
root.addEventListener('pointerdown',event=>{if(event.button!==0)return;root.setPointerCapture?.(event.pointerId);drag={x:event.screenX,y:event.screenY,lastX:event.screenX,moved:false};root.classList.add('dragging');setState('running-right');petBridge?.dragStart({x:event.screenX,y:event.screenY});event.preventDefault()});
root.addEventListener('pointermove',event=>{if(!drag)return;const dx=event.screenX-drag.lastX;if(Math.abs(event.screenX-drag.x)+Math.abs(event.screenY-drag.y)>3)drag.moved=true;if(dx){const next=dx<0?'running-left':'running-right';if(state!==next)setState(next);drag.lastX=event.screenX}petBridge?.dragMove({x:event.screenX,y:event.screenY});event.preventDefault()});
function finishDrag(){if(!drag)return;const wasClick=!drag.moved;drag=null;root.classList.remove('dragging');petBridge?.dragEnd();if(wasClick){setState('waving',900);petBridge?.event('pet-click')}else setState('idle')}root.addEventListener('pointerup',finishDrag);root.addEventListener('pointercancel',()=>{drag=null;root.classList.remove('dragging');petBridge?.dragEnd();setState('idle')});root.addEventListener('contextmenu',event=>{event.preventDefault();petBridge?.openMenu()});root.addEventListener('dblclick',event=>{event.preventDefault();petBridge?.openChat()});root.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();setState('waving',900);petBridge?.event('pet-click')}if(event.key==='ContextMenu'||(event.shiftKey&&event.key==='F10')){event.preventDefault();petBridge?.openMenu()}});root.addEventListener('pointermove',pointLook);root.addEventListener('pointerleave',()=>{if(!drag){look=-1;renderSprite()}});
const eventState={navigate:['running',850],'journal-open':['review',1200],'journal-focus-enter':['review',0],'journal-focus-exit':['idle',0],'journal-section':['review',700],'journal-complete':['waving',1100],theme:['jumping',900],typography:['review',700],'pet-click':['waving',900],'entry-created':['waving',1000],'entry-updated':['review',850],'lifeos:backend-exit':['failed',0]},manualDuration={idle:0,'running-right':1200,'running-left':1200,waving:1300,jumping:1100,failed:1500,waiting:0,running:1500,review:1500};petBridge?.onEvent?.(event=>{if(drag)return;const type=event?.type;if(type==='pet-drag')return setState(event?.detail?.direction==='left'?'running-left':'running-right');if(type==='pet-drag-end')return setState('idle');if(type==='pet-action'){const next=event?.detail?.state;return setState(next,manualDuration[next]??0)}const next=eventState[type];if(next)setState(next[0],next[1])});
petBridge?.onConfig?.(applyConfig);applyConfig(initialMeta);
</script>
