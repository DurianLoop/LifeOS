name: Native iOS rebuild and Liquid Glass acceptance
on:
  push:
    branches: [codex/ios-glass-rebuild]
    paths: ['mobile/ios-native/**', '.github/workflows/ios-native-rebuild.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-native-rebuild-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify public source and toolchain
        run: |
          python3 scripts/public_release_audit.py
          xcodebuild -version
          xcrun swift --version
          python3 mobile/ios-native/generate_project.py
      - name: Test durable storage and migration
        working-directory: mobile/ios-native
        run: swift test
      - name: Select iOS 26 simulator
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          candidates=[d for runtime,values in devices.items() if 'iOS-26' in runtime for d in values if 'iPhone' in d['name']]
          assert candidates,'Liquid Glass acceptance requires an iOS 26 simulator'
          device=next((d for d in candidates if d['name']=='iPhone 17 Pro'),candidates[0])
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('LIFEOS_IOS_DEVICE='+device['udid']+'\n')
          print(device['name'])
          PY
      - name: Build and test actual native iPhone app
        working-directory: mobile/ios-native
        run: |
          set -o pipefail
          mkdir -p build/qa
          xcodebuild test -project LifeOS.xcodeproj -scheme LifeOS -destination "platform=iOS Simulator,id=$LIFEOS_IOS_DEVICE" -derivedDataPath DerivedData -resultBundlePath TestResults.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/qa/xcodebuild.log
      - name: Collect native screenshots and test results
        if: always()
        working-directory: mobile/ios-native
        run: |
          mkdir -p build/qa
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path build/qa/screenshots || true
            xcrun xcresulttool get test-results summary --path TestResults.xcresult --format json > build/qa/TEST_SUMMARY.json || true
          fi
          xcrun simctl io "$LIFEOS_IOS_DEVICE" screenshot build/qa/final-screen.png || true
      - name: Build clean simulator distribution
        working-directory: mobile/ios-native
        run: |
          xcodebuild build -project LifeOS.xcodeproj -scheme LifeOS -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
          mkdir -p build/dist
          ditto -c -k --keepParent DerivedData/Build/Products/Release-iphonesimulator/LifeOS.app build/dist/LifeOS-0.7.0-ios-simulator-arm64.zip
          python3 make_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-ios-native-simulator
          if-no-files-found: error
          path: mobile/ios-native/build/dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifeos-ios-native-qa
          if-no-files-found: ignore
          path: mobile/ios-native/build/qa/
