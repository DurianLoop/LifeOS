name: Native iOS rebuild and Liquid Glass acceptance
on:
  push:
    branches: [codex/ios-glass-rebuild]
    paths: ['mobile/ios-native/**', '.github/workflows/ios-native-rebuild.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-native-rebuild-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-ios:
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify public source and toolchain
        run: |
          python3 scripts/public_release_audit.py
          xcodebuild -version
          xcrun swift --version
          python3 mobile/ios-native/generate_project.py
      - name: Test durable storage and migration
        working-directory: mobile/ios-native
        run: |
          set -o pipefail
          mkdir -p build/qa
          swift test 2>&1 | tee build/qa/core-tests.log
      - name: Select iOS 26 simulator
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          candidates=[d for runtime,values in devices.items() if 'iOS-26' in runtime for d in values if 'iPhone' in d['name']]
          assert candidates,'Liquid Glass acceptance requires an iOS 26 simulator'
          device=next((d for d in candidates if d['name']=='iPhone 17 Pro'),candidates[0])
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('LIFEOS_IOS_DEVICE='+device['udid']+'\n')
          print(device['name'])
          PY
      - name: Boot iPhone before attaching XCTest
        run: |
          xcrun simctl boot "$LIFEOS_IOS_DEVICE" || true
          xcrun simctl bootstatus "$LIFEOS_IOS_DEVICE" -b
      - name: Build and test actual native iPhone app
        working-directory: mobile/ios-native
        run: |
          set -o pipefail
          mkdir -p build/qa
          xcodebuild test -project LifeOS.xcodeproj -scheme LifeOS -destination "platform=iOS Simulator,id=$LIFEOS_IOS_DEVICE" -derivedDataPath DerivedData -resultBundlePath TestResults.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/qa/xcodebuild.log
      - name: Verify writing and larger text on compact iPhone
        if: ${{ !cancelled() && env.LIFEOS_IOS_DEVICE != '' }}
        working-directory: mobile/ios-native
        run: |
          set -o pipefail
          xcrun simctl shutdown "$LIFEOS_IOS_DEVICE"
          LIFEOS_COMPACT_DEVICE=$(python3 - <<'PY'
          import json,subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','-j']))
          runtime=next(r['identifier'] for r in data['runtimes'] if r.get('isAvailable') and 'iOS-26' in r['identifier'])
          kind=next(d['identifier'] for d in data['devicetypes'] if d['name']=='iPhone SE (3rd generation)')
          print(subprocess.check_output(['xcrun','simctl','create','LifeOS compact acceptance',kind,runtime],text=True).strip())
          PY
          )
          xcrun simctl boot "$LIFEOS_COMPACT_DEVICE"
          xcrun simctl bootstatus "$LIFEOS_COMPACT_DEVICE" -b
          xcodebuild test -project LifeOS.xcodeproj -scheme LifeOS -destination "platform=iOS Simulator,id=$LIFEOS_COMPACT_DEVICE" -derivedDataPath DerivedData -resultBundlePath CompactResults.xcresult -parallel-testing-enabled NO -only-testing:LifeOSUITests/LifeOSUITests/testEditingAndRestartPersistence -only-testing:LifeOSUITests/LifeOSUITests/testAccessibilityLargeText -only-testing:LifeOSUITests/LifeOSUITests/testSearchJournalAndLibrary CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/qa/compact-xcodebuild.log
      - name: Collect native screenshots and test results
        if: always()
        working-directory: mobile/ios-native
        run: |
          mkdir -p build/qa
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path build/qa/screenshots || true
            xcrun xcresulttool get test-results summary --path TestResults.xcresult --format json > build/qa/TEST_SUMMARY.json || true
          fi
          if [ -d CompactResults.xcresult ]; then
            xcrun xcresulttool export attachments --path CompactResults.xcresult --output-path build/qa/compact-screenshots || true
            xcrun xcresulttool get test-results summary --path CompactResults.xcresult --format json > build/qa/COMPACT_TEST_SUMMARY.json || true
          fi
          xcrun simctl io "$LIFEOS_IOS_DEVICE" screenshot build/qa/final-screen.png || true
      - name: Build iPhone package for local Apple ID signing
        working-directory: mobile/ios-native
        run: |
          xcodebuild archive -project LifeOS.xcodeproj -scheme LifeOS -configuration Release -destination 'generic/platform=iOS' -archivePath build/LifeOS.xcarchive -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO
          mkdir -p build/phone/Payload build/dist
          ditto build/LifeOS.xcarchive/Products/Applications/LifeOS.app build/phone/Payload/LifeOS.app
          ditto -c -k --keepParent build/phone/Payload build/dist/LifeOS-0.7.1-iphone-unsigned.ipa
      - name: Build clean simulator distribution
        working-directory: mobile/ios-native
        run: |
          xcodebuild build -project LifeOS.xcodeproj -scheme LifeOS -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
          mkdir -p build/dist
          ditto -c -k --keepParent DerivedData/Build/Products/Release-iphonesimulator/LifeOS.app build/dist/LifeOS-0.7.1-ios-simulator-arm64.zip
          python3 make_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-ios-native-simulator
          if-no-files-found: error
          path: mobile/ios-native/build/dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifeos-ios-native-qa
          if-no-files-found: ignore
          path: mobile/ios-native/build/qa/
