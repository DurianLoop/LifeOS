/* ===== Beauty pass · quiet dreamcraft / tactile editorial details ===== */
:root{
 --beauty-inkwash:color-mix(in srgb,var(--dream-accent) 10%,transparent);
 --beauty-sheen:color-mix(in srgb,var(--paper2) 74%,white 26%);
 --beauty-shadow:0 28px 80px rgba(45,34,41,.085),0 2px 8px rgba(45,34,41,.035);
 --beauty-hair:color-mix(in srgb,var(--line) 76%,transparent);
}
html{font-feature-settings:"kern" 1,"liga" 1,"palt" 1;text-rendering:optimizeLegibility}
::selection{background:color-mix(in srgb,var(--dream-accent) 24%,transparent);color:var(--ink)}
body{
 background:
  radial-gradient(ellipse at 18% 8%,color-mix(in srgb,var(--dream-glow) 72%,transparent),transparent 31%),
  radial-gradient(ellipse at 82% 54%,color-mix(in srgb,var(--dream-glow) 54%,transparent),transparent 34%),
  linear-gradient(115deg,color-mix(in srgb,var(--paper) 62%,transparent),transparent 34%,color-mix(in srgb,var(--paper2) 38%,transparent) 76%),
  var(--dream-bg);
}
body:before{opacity:.047;background-size:173px 173px,247px 247px,337px 337px;filter:blur(.1px)}
body::-webkit-scrollbar,.journalList::-webkit-scrollbar,.journalMeta::-webkit-scrollbar,.atticPanel::-webkit-scrollbar{width:9px;height:9px}
body::-webkit-scrollbar-thumb,.journalList::-webkit-scrollbar-thumb,.journalMeta::-webkit-scrollbar-thumb,.atticPanel::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--dream-accent) 24%,var(--paper));border:3px solid transparent;background-clip:padding-box}
.rail{box-shadow:10px 0 38px rgba(60,45,52,.035);border-right-color:var(--beauty-hair)}
.brand{position:relative}.brand:before{content:"";position:absolute;left:4px;right:4px;bottom:-1px;height:1px;background:linear-gradient(90deg,var(--dream-accent),transparent 75%);opacity:.52}.brandWord{display:flex;align-items:center;gap:8px}.brandWord:after{content:"✦";font-size:9px;color:var(--dream-accent);font-weight:400;transform:translateY(-2px);opacity:.72}
.roomBtn{position:relative;transition:color .18s ease,background .18s ease,transform .18s ease}.roomBtn:before{content:"";position:absolute;left:1px;width:3px;height:3px;border-radius:50%;background:var(--dream-accent);opacity:0;transform:scale(.2);transition:.18s ease}.roomBtn.active:before{opacity:.72;transform:scale(1)}
.topbar{border-bottom-color:var(--beauty-hair);box-shadow:0 8px 28px rgba(54,42,47,.025)}
.crumb strong{font-family:var(--serif);font-size:11px;font-weight:500;letter-spacing:.02em}
.page{position:relative}.page:before{content:"";position:absolute;top:29px;right:clamp(24px,5vw,78px);width:42px;height:1px;background:linear-gradient(90deg,transparent,var(--dream-accent));opacity:.34;pointer-events:none}

/* Home: a restrained lunar seal behind the editorial title */
.editorialHero{position:relative;isolation:isolate;overflow:hidden}.editorialHero:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(104deg,transparent 0 52%,color-mix(in srgb,var(--dream-accent) 3%,transparent) 52% 52.12%,transparent 52.12%)}
.heroCopy{position:relative;z-index:1}.heroSigil{position:absolute;right:clamp(-54px,-3vw,-12px);top:-31px;width:176px;height:176px;border:1px solid color-mix(in srgb,var(--dream-accent) 22%,transparent);border-radius:50%;display:grid;place-content:center;text-align:center;color:var(--dream-accent);opacity:.34;pointer-events:none;transform:rotate(-8deg)}
.heroSigil:before,.heroSigil:after{content:"";position:absolute;border-radius:50%;inset:15px;border:1px solid color-mix(in srgb,var(--dream-accent) 22%,transparent)}.heroSigil:after{inset:44px;border-style:dashed;opacity:.58}
.heroSigil b{font:400 48px/.9 var(--serif);letter-spacing:-.07em}.heroSigil small{font:8px/1.4 var(--mono);letter-spacing:.16em;margin-top:8px}.sigilOrbit i{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--dream-accent)}.sigilOrbit i:nth-child(1){left:14px;top:82px}.sigilOrbit i:nth-child(2){right:31px;top:24px;width:3px;height:3px}.sigilOrbit i:nth-child(3){right:12px;bottom:49px;width:3px;height:3px}
.homeDisplay{position:relative;text-shadow:0 1px 0 color-mix(in srgb,var(--paper) 70%,transparent)}.homeDisplay em{position:relative;background:linear-gradient(180deg,transparent 74%,color-mix(in srgb,var(--dream-accent) 10%,transparent) 74% 92%,transparent 92%);padding-right:.08em}.homeLead{max-width:720px}
.heroLinks button{position:relative;transition:color .18s ease,border-color .18s ease,padding .18s ease}.heroLinks button:after{content:"";position:absolute;right:-10px;bottom:8px;width:3px;height:3px;border-radius:50%;background:currentColor;opacity:0;transform:translateX(-4px);transition:.18s ease}.heroLinks button:hover{padding-right:13px}.heroLinks button:hover:after{opacity:.55;transform:none}
.archiveLedger{position:relative;padding-top:54px}.archiveLedger:before{content:"◐  ○  ◑";position:absolute;top:4px;right:0;font:12px/1 var(--serif);letter-spacing:.42em;color:var(--dream-accent);opacity:.52}.archiveLedger:after{content:"PRIVATE / LOCAL";position:absolute;top:28px;right:0;font:7px var(--mono);letter-spacing:.17em;color:var(--muted)}.archiveLedger dl div{transition:padding .18s ease}.archiveLedger dl div:hover{padding-left:6px}.archiveLedger dd{font-variant-numeric:oldstyle-nums}

/* The newest memory reads like an archival sheet, not a dashboard card */
.memoryFeature{overflow:hidden;box-shadow:var(--beauty-shadow);background:linear-gradient(104deg,color-mix(in srgb,var(--paper2) 92%,transparent),color-mix(in srgb,var(--paper) 72%,transparent));isolation:isolate}.memoryFeature:after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 92% 14%,color-mix(in srgb,var(--dream-accent) 7%,transparent),transparent 23%),repeating-linear-gradient(0deg,transparent 0 31px,color-mix(in srgb,var(--line) 8%,transparent) 31px 32px)}
.memoryFeatureInner{position:relative}.memoryFeature blockquote{position:relative;padding-left:20px}.memoryFeature blockquote:before{content:"“";position:absolute;left:-3px;top:-9px;font:52px/.8 var(--serif);color:var(--dream-accent);opacity:.24}.memoryStamp{position:absolute;right:28px;top:23px;z-index:2;width:60px;height:60px;border:1px solid color-mix(in srgb,var(--dream-accent) 38%,transparent);border-radius:50%;display:grid;place-content:center;text-align:center;color:var(--dream-accent);transform:rotate(8deg);opacity:.48}.memoryStamp:before{content:"";position:absolute;inset:5px;border:1px dashed currentColor;border-radius:50%;opacity:.55}.memoryStamp span{font:10px/1 var(--mono);letter-spacing:.12em}.memoryStamp small{font:7px/1.3 var(--mono);letter-spacing:.15em;margin-top:3px}.dateRibbon button{position:relative;transition:background .18s ease,color .18s ease}.dateRibbon button:after{content:"";position:absolute;left:10px;bottom:0;width:0;height:1px;background:var(--dream-accent);transition:width .18s ease}.dateRibbon button:hover{background:color-mix(in srgb,var(--dream-accent) 5%,transparent)}.dateRibbon button:hover:after{width:calc(100% - 20px)}
.homeAside button{position:relative;overflow:hidden}.homeAside button:after{content:"";position:absolute;right:0;bottom:-1px;width:28%;height:1px;background:var(--dream-accent);opacity:.22;transform:translateX(110%);transition:transform .24s ease}.homeAside button:hover:after{transform:none}.homeAside>button>span{padding-top:3px}

/* Portal rows gain tiny astronomical geometry rather than decorative cards */
.portalGrid button,.orientationGrid button{position:relative;overflow:hidden;transition:background .2s ease}.portalGrid button:before{content:"";position:absolute;right:20px;top:20px;width:34px;height:34px;border:1px solid color-mix(in srgb,var(--dream-accent) 24%,transparent);border-radius:50%;opacity:.6;transition:transform .28s ease,opacity .28s ease}.portalGrid button:after{content:"";position:absolute;right:35px;top:15px;width:1px;height:44px;background:color-mix(in srgb,var(--dream-accent) 20%,transparent);transform:rotate(42deg);transform-origin:center}.portalGrid button:hover:before{transform:scale(1.12) translate(-2px,2px);opacity:.9}.portalGrid button:nth-child(2):before{border-radius:3px;transform:rotate(45deg)}.portalGrid button:nth-child(2):hover:before{transform:rotate(52deg) scale(1.08)}.portalGrid button:nth-child(3):before{box-shadow:-11px 7px 0 -8px var(--dream-accent),9px -7px 0 -9px var(--dream-accent)}
.sectionIntro h2{position:relative}.sectionIntro h2:after{content:"✦";display:inline-block;margin-left:12px;font-size:.22em;vertical-align:top;color:var(--dream-accent);opacity:.46;transform:translateY(.5em)}
.orientationGrid strong{text-shadow:0 8px 30px var(--dream-glow)}
.homeResume button{position:relative;overflow:hidden;transition:background .18s ease}.homeResume button:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--dream-accent);opacity:.5}.homeResume button:hover{background:color-mix(in srgb,var(--dream-accent) 4%,transparent)}

/* Journal becomes a tactile sheet with restrained baseline texture */
.journalPaper{overflow:hidden;border-color:color-mix(in srgb,var(--line) 82%,transparent);box-shadow:0 30px 85px rgba(43,33,27,.11),0 2px 4px rgba(43,33,27,.035);background-color:#fcf8ef;background-image:radial-gradient(circle at 12% 16%,rgba(115,89,68,.028) 0 1px,transparent 1.4px),repeating-linear-gradient(180deg,transparent 0 31px,rgba(110,92,78,.038) 31px 32px)}
.journalPaper:after{content:"";position:absolute;pointer-events:none;inset:0;box-shadow:inset -22px 0 38px rgba(93,67,47,.025),inset 0 -12px 24px rgba(93,67,47,.02);border-right:1px solid rgba(255,255,255,.65)}
.journalDate{position:relative;display:inline-block}.journalDate:after{content:"";display:block;width:62%;height:1px;margin-top:10px;background:linear-gradient(90deg,var(--dream-accent),transparent);opacity:.32}.journalSection h4{position:relative;padding-left:13px}.journalSection h4:before{content:"";position:absolute;left:0;top:50%;width:5px;height:5px;border:1px solid var(--dream-accent);transform:translateY(-50%) rotate(45deg);opacity:.42}.journalList{border-color:var(--beauty-hair)}.journalItem{position:relative}.journalItem.active:after{content:"";position:absolute;right:0;top:0;bottom:0;width:2px;background:var(--dream-accent);opacity:.55}

/* Small system-wide finishing touches */
.card,.searchResult,.classicalWorkspace,.modalBox,.paletteBox{border-color:var(--beauty-hair)}
.card.click,.atticItem,.journalItem,.portalGrid button,.orientationGrid button,.homeAside button{transition-duration:.18s}
.badge{letter-spacing:.1em}.rule{border-color:var(--beauty-hair)}
.btn{position:relative}.btn:not(.primary):hover{background:color-mix(in srgb,var(--dream-accent) 6%,transparent);color:var(--ink);border-color:color-mix(in srgb,var(--dream-accent) 45%,var(--line))}.btn.primary{box-shadow:0 7px 22px color-mix(in srgb,var(--dream-accent) 16%,transparent)}
.dreamPet{box-shadow:0 14px 38px rgba(53,41,48,.12),0 0 0 5px color-mix(in srgb,var(--paper) 58%,transparent)}
/* The rail owns interface adjustment. The companion remains a single, quiet action. */
.dreamDock{left:auto;right:18px;bottom:18px;align-items:center}.dreamPetBubble{left:auto;right:22px;bottom:78px;border-radius:14px 14px 3px 14px}@media(max-width:880px){.dreamDock{left:auto;right:12px;bottom:82px}.dreamPetBubble{left:auto;right:12px;bottom:138px}}

html[data-theme="film"] .editorialHero:before{background:linear-gradient(90deg,transparent 0 7%,rgba(192,111,85,.05) 7% 7.2%,transparent 7.2% 92%,rgba(77,127,134,.05) 92% 92.2%,transparent 92.2%)}

 html[data-theme="hotel"] body{background:linear-gradient(180deg,#e7dec6,#dcd2b8)}

 html[data-theme="film"] .memoryFeature{transform:none}
}

@media(max-width:880px){.page:before{display:none}.heroSigil{right:4px;top:-18px;width:116px;height:116px;opacity:.22}.heroSigil:after{inset:32px}.heroSigil b{font-size:32px}.archiveLedger{padding-top:0}.memoryStamp{width:52px;height:52px;right:14px;top:13px}.portalGrid button:before{right:18px;top:18px}.sectionIntro h2:after{font-size:.18em}}
@media(max-width:520px){.heroSigil{width:96px;height:96px;right:-10px;top:-11px}.heroSigil:before{inset:10px}.heroSigil:after{inset:26px}.heroSigil b{font-size:28px}.heroSigil small{display:none}.memoryStamp{display:none}.memoryFeature blockquote{padding-left:15px}.portalGrid button:before{width:28px;height:28px}.portalGrid button:after{height:36px;right:31px}.journalPaper{background-image:radial-gradient(circle at 12% 16%,rgba(115,89,68,.024) 0 1px,transparent 1.4px)}}
@media(prefers-reduced-motion:reduce){.roomBtn,.heroLinks button,.portalGrid button:before,.dateRibbon button:after,.homeAside button:after,.archiveLedger dl div{transition:none!important}}

/* Beauty QA round 2 · keep the dreamy layers quieter where content is dense */
html[data-theme="candy"] body{background:radial-gradient(ellipse at 16% 7%,rgba(226,164,199,.16),transparent 30%),radial-gradient(ellipse at 86% 66%,rgba(186,158,221,.11),transparent 34%),linear-gradient(145deg,#fff9fb 0%,#fbf2f7 52%,#f8f4fc 100%)}

}

/* ===== Typography Edition · reading rhythm / editorial hierarchy ===== */
:root{
 --type-serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",Georgia,"Times New Roman",serif;
 --type-sans:Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 --type-mono:"SFMono-Regular",Consolas,"Liberation Mono",ui-monospace,monospace;
 --type-ui:15px;--type-reading:18.5px;--type-small:12px;
 --leading-ui:1.68;--leading-reading:1.86;--leading-tight:1.08;
 --reading-measure:36em;--prose-measure:56ch;--note-measure:40ch;
 --tracking-display:-.035em;--tracking-title:-.022em;
 --rhythm-section:48px;--rhythm-paragraph:1.05em;
}
html[data-type="airy"]{--type-ui:15.5px;--type-reading:19.5px;--leading-ui:1.76;--leading-reading:1.98;--reading-measure:34em;--prose-measure:52ch;--rhythm-section:58px;--rhythm-paragraph:1.2em}
html[data-type="literary"]{--type-ui:15px;--type-reading:18.5px;--leading-ui:1.68;--leading-reading:1.88;--reading-measure:36em;--prose-measure:56ch;--rhythm-section:48px;--rhythm-paragraph:1.08em}
html[data-type="compact"]{--type-ui:14px;--type-reading:17px;--leading-ui:1.58;--leading-reading:1.72;--reading-measure:42em;--prose-measure:64ch;--rhythm-section:36px;--rhythm-paragraph:.85em}
html{font-family:var(--type-sans);font-synthesis:none;text-size-adjust:100%;-webkit-text-size-adjust:100%;text-autospace:normal}
body{font-family:var(--type-sans);font-size:var(--type-ui);line-height:var(--leading-ui);letter-spacing:.004em}
:where(p,li,blockquote,.moduleNote,.homeLead,.card p,.small){text-wrap:pretty;overflow-wrap:anywhere}
:where(h1,h2,h3,h4,h5,h6,.display,.homeDisplay,.moduleTitle,.roomTitle,.bookTitle){text-wrap:balance;word-break:normal;line-break:strict}
:where(time,.dateCaps,.score,.kicker,.heroKicker,.ledgerTitle,.brandSub,.romanticCanonical,.badge,.roomBtn,.crumb,.smallCaps){font-variant-numeric:tabular-nums;font-family:var(--type-mono)}
:where(.serif,.bigSerif,.lead,.quote,.card h3,.journalItem b,.journalDate,.journalSection p,.bookTitle,.dayEdition h3,.dayEdition blockquote,.memoryFeature h2,.memoryFeature blockquote,.homeAside b,.portalGrid b,.orientationGrid b,.orientationGrid strong,.homeResume b,.moduleTitle,.roomTitle,.homeDisplay,.archiveLedger dd){font-family:var(--type-serif)}

/* Global editorial rhythm */
.page{padding-top:clamp(38px,4.5vw,72px);padding-bottom:clamp(84px,8vw,124px)}
.module{padding-top:0;margin-top:var(--rhythm-section)}
.module:first-child{margin-top:0}
.moduleHead{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,420px);gap:clamp(28px,5vw,72px);align-items:end;padding-bottom:17px;margin-bottom:25px;border-bottom:1px solid var(--line)}
.moduleTitle{font-size:clamp(34px,3.25vw,50px);line-height:1.08;letter-spacing:var(--tracking-title);max-width:17ch;margin:4px 0 0}
.moduleNote{justify-self:end;max-width:var(--note-measure);font-size:12.5px;line-height:1.72;margin:0}
.kicker{font-size:9px;line-height:1.35;letter-spacing:.15em;font-weight:600}
.small{font-size:var(--type-small);line-height:1.62}
.rule{margin:clamp(28px,4vw,46px) 0}
.card{padding:clamp(19px,2vw,26px)}
.card h3{font-size:clamp(22px,2vw,28px);line-height:1.22;letter-spacing:-.012em;max-width:19ch;margin:9px 0 11px}
.card p{font-size:13.5px;line-height:1.72;max-width:var(--prose-measure)}
.bigSerif{font-size:clamp(29px,2.6vw,38px);line-height:1.25;letter-spacing:-.015em}

/* Home · clearer hierarchy, calmer measure */
.homePage{max-width:1360px}
.editorialHero{min-height:540px;grid-template-columns:minmax(0,8.4fr) minmax(230px,2.7fr);gap:clamp(48px,7vw,104px);padding:clamp(72px,7vw,104px) 0 clamp(48px,5vw,68px)}
.heroKicker{font-size:9px;line-height:1.4;letter-spacing:.16em}
.homeDisplay{font-family:var(--type-serif);font-size:clamp(58px,6.65vw,96px);line-height:.97;letter-spacing:var(--tracking-display);max-width:9.8ch;margin:clamp(25px,3vw,38px) 0 24px;font-weight:400}
.homeDisplay em{line-height:1.02}
.homeLead{font-family:var(--type-serif);font-size:clamp(17.5px,1.55vw,21.5px);line-height:1.82;max-width:34em;color:color-mix(in srgb,var(--ink) 68%,var(--muted))}
.heroLinks{margin-top:35px;gap:clamp(16px,2.2vw,28px)}
.heroLinks button{font-size:12px;line-height:1.3;letter-spacing:.015em}
.archiveLedger{padding-top:62px}
.ledgerTitle{font-size:8px;line-height:1.4;letter-spacing:.16em;padding:9px 0}
.archiveLedger dl div{padding:18px 0 16px;gap:20px}
.archiveLedger dt{font-size:12px;line-height:1.45}
.archiveLedger dd{font-size:clamp(34px,3vw,43px);line-height:.95;letter-spacing:-.035em;font-variant-numeric:tabular-nums lining-nums}
.archiveLedger p{font-family:var(--type-serif);font-size:10.5px;line-height:1.85;max-width:28ch}
.homeMemoryGrid{grid-template-columns:minmax(0,1.62fr) minmax(250px,.64fr);gap:clamp(36px,5vw,72px);padding:clamp(50px,5vw,72px) 0}
.memoryFeatureInner{padding:clamp(38px,4vw,56px) clamp(38px,4vw,58px) clamp(32px,3vw,44px) clamp(58px,5vw,78px)}
.memoryFeature h2{font-size:clamp(38px,4vw,58px);line-height:1.08;letter-spacing:-.025em;max-width:13ch;margin:16px 0 20px}
.memoryFeature blockquote{font-family:var(--type-serif);font-size:clamp(18px,1.55vw,22px);line-height:1.8;max-width:34em}
.homeAside button{grid-template-columns:32px minmax(0,1fr);gap:15px;min-height:116px;padding:21px 0}
.homeAside b{font-size:clamp(20px,1.7vw,24px);line-height:1.28;letter-spacing:-.012em}
.homeAside small{font-size:11.5px;line-height:1.7;max-width:28ch;margin-top:7px}
.sectionIntro{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,420px);gap:clamp(30px,5vw,70px);align-items:end;margin-bottom:28px}
.sectionIntro h2{font-size:clamp(34px,3.8vw,52px);line-height:1.08;letter-spacing:-.025em;max-width:16ch}
.sectionIntro p{justify-self:end;font-size:12.5px;line-height:1.75;max-width:var(--note-measure);margin:0}
.portalGrid button,.orientationGrid button{padding:27px 24px 25px;min-height:176px}
.portalGrid b{font-size:clamp(22px,2vw,27px);line-height:1.25;letter-spacing:-.012em;margin-top:38px;max-width:13ch}
.portalGrid small,.orientationGrid small{font-size:11.5px;line-height:1.7;max-width:31ch;margin-top:8px}
.orientationGrid b{font-size:19px;line-height:1.35;max-width:18ch}
.orientationGrid strong{font-size:clamp(26px,2.3vw,32px);line-height:1.15;letter-spacing:-.018em}
.homeResume button{grid-template-columns:126px minmax(0,1fr) auto;padding:15px 18px;gap:18px}
.homeResume b{font-size:17px;line-height:1.35}

/* Journal · true reading column */
.journalLayout{grid-template-columns:clamp(220px,18vw,260px) minmax(0,1fr) clamp(190px,15vw,230px);gap:clamp(22px,2.6vw,36px)}
.journalItem{padding:12px 13px;min-height:64px}
.journalItem b{font-size:17px;line-height:1.35;letter-spacing:-.008em}
.journalItem span{font-size:9.5px;line-height:1.45;margin-top:5px}
.journalPaper{padding:clamp(42px,5vw,76px) clamp(42px,6vw,88px) clamp(56px,6vw,86px);min-height:760px}
.journalDate,.journalSection{width:min(100%,var(--reading-measure));max-width:var(--reading-measure);margin-left:auto;margin-right:auto}
.journalDate{display:block;font-size:clamp(35px,3.4vw,48px);line-height:1.08;letter-spacing:-.025em;margin-top:0;margin-bottom:clamp(31px,4vw,46px)}
.journalSection{margin-bottom:clamp(28px,3.2vw,42px)}
.journalSection.empty{margin-bottom:13px}
.journalSection h4{font-family:var(--type-sans);font-size:10px;line-height:1.45;letter-spacing:.13em;margin:0 0 11px;font-weight:600}
.journalSection p{font-family:var(--type-serif);font-size:var(--type-reading);line-height:var(--leading-reading);letter-spacing:.008em;margin:0;orphans:3;widows:3;hanging-punctuation:first last}
.journalSection p+p{margin-top:var(--rhythm-paragraph)}
.journalMeta{font-size:12px;line-height:1.65}

/* Search / evidence / timelines · align dates with prose */
.searchline input{font-family:var(--type-serif);font-size:clamp(23px,2.5vw,31px);line-height:1.3}
.searchResult{grid-template-columns:96px minmax(0,1fr) auto;gap:clamp(16px,2vw,26px);padding:20px 0}
.searchResult time{font-size:10px;line-height:1.5;padding-top:3px}
.searchResult p,.evidence p,.candidateItem p,.deepReadItem p,.projectEvidence p{font-family:var(--type-serif);font-size:clamp(16.5px,1.35vw,18px);line-height:1.72;max-width:var(--prose-measure)}
.searchReason{font-size:9px;line-height:1.45;letter-spacing:.08em}
.row{grid-template-columns:minmax(86px,108px) minmax(0,1fr) auto;gap:clamp(14px,2vw,24px);padding:16px 0;line-height:1.62}
.row time{font-size:10px;line-height:1.5;padding-top:2px}
.row b{line-height:1.45}

/* Books and long-form surfaces */
.book{max-width:1160px}
.pageLeft,.pageRight{padding:clamp(42px,4.6vw,62px)}
.bookTitle{font-family:var(--type-serif);font-size:clamp(42px,4.5vw,58px);line-height:1.06;letter-spacing:-.026em;margin:24px 0}
.bookSourceExcerpt p,.sourceRibbonItem p{font-family:var(--type-serif);font-size:16.5px;line-height:1.72;max-width:44em}
.dayEdition h3{font-size:clamp(30px,3vw,38px);line-height:1.08;letter-spacing:-.02em}
.dayEdition blockquote{font-size:17.5px;line-height:1.75}

/* Typography control */
.typeHint{display:block;margin-top:7px;font:10px/1.55 var(--type-serif);color:var(--muted);max-width:280px}
html[data-type="compact"] .memoryFeatureInner{padding-top:34px;padding-bottom:28px}
html[data-type="compact"] .portalGrid button,html[data-type="compact"] .orientationGrid button{min-height:152px}
html[data-type="compact"] .editorialHero{min-height:500px;padding-top:62px}
html[data-type="airy"] .journalPaper{padding-top:clamp(50px,6vw,88px);padding-bottom:clamp(68px,7vw,100px)}

/* Breakpoints focused on typographic integrity */
@media(max-width:1180px){

/* ===== Living Memory Edition · interaction, focus, ritual ===== */
:root{--living-ease:cubic-bezier(.22,.78,.24,1);--living-fast:180ms;--living-slow:520ms}
.dayPulse{margin-top:28px;max-width:620px;display:grid;grid-template-columns:10px minmax(0,1fr);gap:3px 12px;align-items:start;color:var(--muted)}
.dayPulseDot{grid-row:1/3;width:7px;height:7px;border-radius:50%;margin-top:7px;background:var(--dream-accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--dream-accent) 9%,transparent),0 0 22px var(--dream-glow)}
.dayPulse b{font:400 13px/1.45 var(--type-serif);color:color-mix(in srgb,var(--ink) 78%,var(--muted));letter-spacing:.01em}
.dayPulse small{font:10.5px/1.6 var(--type-serif);color:var(--muted)}
html[data-motion="alive"] .dayPulseDot{animation:archiveHeartbeat 3.6s ease-in-out infinite}
@keyframes archiveHeartbeat{50%{transform:scale(.74);box-shadow:0 0 0 8px color-mix(in srgb,var(--dream-accent) 4%,transparent),0 0 30px var(--dream-glow)}}
html[data-motion="alive"] .memoryFeature{animation:inkSettle .58s var(--living-ease) .06s both}
html[data-motion="alive"] .homeAside{animation:inkSettle .58s var(--living-ease) .13s both}
html[data-motion="alive"] .portalSection{animation:inkSettle .62s var(--living-ease) .18s both}
html[data-motion="alive"] .orientationSection{animation:inkSettle .62s var(--living-ease) .24s both}
html[data-motion="alive"] .homeResume{animation:inkSettle .62s var(--living-ease) .30s both}
html[data-motion="alive"] .journalSection:not(.empty){animation:inkSettle .48s var(--living-ease) both}
html[data-motion="alive"] .journalSection:nth-of-type(2n){animation-delay:.035s}
html[data-motion="alive"] .journalSection:nth-of-type(3n){animation-delay:.07s}
@keyframes inkSettle{from{opacity:0;transform:translateY(10px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
html[data-motion="quiet"] :where(.memoryFeature,.homeAside,.portalSection,.orientationSection,.homeResume,.journalSection){animation:none!important;transition-duration:.12s!important}
html[data-motion="off"] *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
.memoryVeil{position:fixed;inset:0;z-index:95;pointer-events:none;opacity:0;background:linear-gradient(104deg,transparent 0 35%,color-mix(in srgb,var(--dream-accent) 8%,transparent) 48%,transparent 62%);transform:translateX(-18%)}
.memoryVeil.turn{animation:memoryTurn .34s var(--living-ease) both}
@keyframes memoryTurn{0%{opacity:0;transform:translateX(-18%)}38%{opacity:1}100%{opacity:0;transform:translateX(18%)}}
.worldFlash{position:fixed;left:50%;top:84px;z-index:92;width:min(360px,calc(100vw - 28px));padding:16px 18px 15px;border:1px solid color-mix(in srgb,var(--line) 85%,transparent);background:var(--dream-panel);backdrop-filter:blur(20px);box-shadow:0 22px 70px rgba(25,19,29,.16);opacity:0;transform:translate(-50%,-10px) scale(.985);pointer-events:none;transition:opacity .22s ease,transform .28s var(--living-ease)}
.worldFlash.show{opacity:1;transform:translate(-50%,0) scale(1)}
.worldFlash span{display:block;font:8px/1.4 var(--type-mono);letter-spacing:.17em;color:var(--dream-accent)}
.worldFlash b{display:block;font:400 22px/1.18 var(--type-serif);margin-top:4px;letter-spacing:-.015em}
.worldFlash small{display:block;font:10.5px/1.55 var(--type-serif);color:var(--muted);margin-top:4px}

.journalReadingRail{position:fixed;left:190px;right:0;top:64px;height:2px;z-index:24;pointer-events:none;background:color-mix(in srgb,var(--line) 34%,transparent);opacity:.88}

async function retrieveAskEvidence(scope='ask'){

async function interpretAskEvidence(force=false,scope='ask'){

 if(q!==reviewed?.question||ui.cutoff!==reviewed?.cutoff){toast('问题或日期已变化，请重新确认证据');await retrieveAskEvidence(scope);return}
 if(!keys.length){toast('请至少选择一条证据');return}
 if(ui.interpret.dataset.busy==='true')return;
 ui.interpret.disabled=true;ui.interpret.dataset.busy='true';ui.run.disabled=true;
 try{
  const d=await post('/api/ask',{...reviewed,stage:'answer',selected_keys:keys,evidence_token:STATE[ui.pack].evidence_token,force_limited:force});
  const a=d.answer||{},status=a.mode||'unknown',citation=a.citation_status;
  const answer=`<div class="answerSheet"><div class="answerText">${answerWithEvidenceLinks(a.text||'')}</div>${status==='insufficient_evidence'?`<div class="actions"><button class="btn" data-ask-force>仍然谨慎解释</button></div>`:citation==='verified'?'<div class="citationOk">引用编号已核对</div>':status==='grounded_llm'?'<div class="citationWarn">部分引用缺失或无效，请核对原文</div>':''}</div>`;
  // Selected evidence is renumbered by the server; render those same IDs so
  // answer links cannot point at a deselected source row.
  renderAskEvidenceReview(ui,d);ui.box.insertAdjacentHTML('afterbegin',answer);
  $$(ui.out+' [data-eid]').forEach(b=>b.onclick=()=>ui.box.querySelector('#evidence-'+b.dataset.eid)?.scrollIntoView({behavior:'smooth',block:'center'}));const retry=$(ui.out+' [data-ask-force]');if(retry)retry.onclick=()=>interpretAskEvidence(true,scope);
 }catch(e){toast(e.message||'请求失败，请重试')}
 finally{ui.interpret.dataset.busy='false';ui.run.disabled=false;syncAskSelection(scope)}
}

function fuzzyScore(f,q){if(!q)return 1;const s=(f.name+" "+f.room+" "+f.desc).toLowerCase(),parts=q.toLowerCase().split(/\s+/).filter(Boolean);let score=0;for(const p of parts){if(f.name.toLowerCase().startsWith(p))score+=8;else if(f.name.toLowerCase().includes(p))score+=5;else if(f.room.toLowerCase().includes(p))score+=3;else if(s.includes(p))score+=1;else return 0}return score}
function drawPalette(q){const scored=FEATURES.map(f=>({f,score:fuzzyScore(f,q)})).filter(x=>x.score>0);if(q.trim()){PAL_ITEMS=scored.sort((a,b)=>b.score-a.score||a.f.no-b.f.no).map(x=>x.f)}else{const order=["ASK",...Object.keys(ROOMS)];PAL_ITEMS=order.flatMap(r=>FEATURES.filter(f=>f.room===r))}PAL_INDEX=Math.min(PAL_INDEX,Math.max(0,PAL_ITEMS.length-1));let room="",html="";PAL_ITEMS.forEach((f,i)=>{if(f.room!==room){room=f.room;html+=`<div class="palGroup">${esc(room)}</div>`}html+=`<div class="pal ${i===PAL_INDEX?"active":""}" data-pal="${esc(f.name)}" data-pali="${i}"><div><span>${String(f.no).padStart(3,"0")} · ${esc(f.name)}</span><span class="palDesc">${esc(f.desc)}</span></div><small>${esc(f.room)}</small></div>`});$("#palResults").innerHTML=html+`<div class="paletteHint">↑ ↓ navigate · Enter open · Esc close · ${PAL_ITEMS.length} matched / 141 total</div>`;$$('[data-pal]').forEach(x=>{x.onclick=()=>{closePalette();openFeature(x.dataset.pal)};x.onmouseenter=()=>{PAL_INDEX=+x.dataset.pali;$$('[data-pal]').forEach(y=>y.classList.toggle('active',y===x))}})}
$("#searchTop").onclick=openPalette;$("#palInput").oninput=e=>{PAL_INDEX=0;drawPalette(e.target.value)};$("#palInput").onkeydown=e=>{if(e.key==="ArrowDown"){e.preventDefault();PAL_INDEX=Math.min(PAL_ITEMS.length-1,PAL_INDEX+1);drawPalette(e.target.value)}else if(e.key==="ArrowUp"){e.preventDefault();PAL_INDEX=Math.max(0,PAL_ITEMS.length-1);drawPalette(e.target.value)}else if(e.key==="Enter"&&PAL_ITEMS[PAL_INDEX]){e.preventDefault();const f=PAL_ITEMS[PAL_INDEX];closePalette();openFeature(f.name)}};$("#palette").onclick=e=>{if(e.target.id==="palette")closePalette()};
