<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>一生的回声 · LifeOS</title>
<style>
:root{--paper:#ede8dd;--ink:#252923;--soft:#fbf8ef;--muted:#6c7269;--line:#b6bdaf;--green:#1e493c;--gold:#ad7044}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Serif CJK SC","Songti SC",Georgia,serif;line-height:1.75}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.32;background-image:radial-gradient(#aaa99b .35px,transparent .35px);background-size:6px 6px}
.wrap{max-width:1220px;margin:auto;padding:0 clamp(18px,5vw,72px)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0;border-bottom:1px solid var(--line);font:12px/1.3 ui-sans-serif,system-ui;letter-spacing:.13em}.top a{color:var(--green);text-decoration:none}.top span{color:var(--muted)}
.hero{display:grid;grid-template-columns:1fr 200px;gap:30px;min-height:58vh;align-items:end;padding:80px 0 65px;border-bottom:1px solid var(--ink)}.eyebrow{color:var(--green);font:11px ui-sans-serif,system-ui;letter-spacing:.22em;text-transform:uppercase}.hero h1{font-size:clamp(56px,9vw,134px);font-weight:400;line-height:1.03;letter-spacing:-.08em;margin:18px 0 30px;overflow-wrap:anywhere}.intro{font-size:clamp(18px,2.1vw,26px);max-width:760px;white-space:pre-wrap}.seal{align-self:center;justify-self:end;border:1px solid var(--green);color:var(--green);border-radius:50%;width:160px;height:160px;display:grid;place-items:center;text-align:center;font-size:32px;line-height:1.3;transform:rotate(-12deg)}
.section{padding:72px 0;border-bottom:1px solid var(--line)}.sectionHead{display:grid;grid-template-columns:200px 1fr;gap:26px;align-items:start;margin-bottom:38px}.sectionNo{font:12px ui-sans-serif,system-ui;color:var(--green);letter-spacing:.16em}.sectionHead h2{font-size:clamp(36px,5vw,65px);font-weight:400;line-height:1.1;margin:0}.sectionHead p{color:var(--muted);margin:16px 0 0;max-width:620px}
.stories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.story{background:var(--soft);padding:32px;border:1px solid var(--line);min-height:280px;box-shadow:8px 8px 0 rgba(30,73,60,.06)}.story:nth-child(3n+2){transform:translateY(18px)}.story time,.entry time{font:12px ui-monospace,monospace;color:var(--green)}.story h3{font-size:31px;font-weight:400;line-height:1.25;margin:18px 0}.story p{white-space:pre-wrap;margin:0;color:#454b42}.story button{border:0;background:transparent;color:var(--green);padding:16px 0 0;text-decoration:underline;cursor:pointer}
.archiveTop{display:flex;gap:14px;align-items:center;justify-content:space-between;margin:0 0 22px}.archiveTop input,.ask input{width:min(100%,400px);background:var(--soft);border:1px solid var(--line);padding:13px 16px;font:15px ui-sans-serif,system-ui}.count{font:12px ui-monospace,monospace;color:var(--muted)}.entry{border-top:1px solid var(--line);display:grid;grid-template-columns:165px 1fr auto;gap:18px;padding:15px 0}.entry button{border:0;background:transparent;cursor:pointer;text-align:left;font:23px "Noto Serif CJK SC","Songti SC",serif;color:var(--ink)}.entry button:hover{color:var(--green)}.entry .arrow{font:24px Georgia;color:var(--green)}.reader{background:var(--soft);border:1px solid var(--line);padding:clamp(25px,5vw,70px);margin-top:26px}.reader h3{font-size:36px;font-weight:400;margin:8px 0 26px}.reader h4{font:12px ui-sans-serif,system-ui;letter-spacing:.14em;color:var(--green);margin:30px 0 8px}.reader p{white-space:pre-wrap;overflow-wrap:anywhere;font:17px/1.9 "Noto Serif CJK SC","Songti SC",Georgia,serif;margin:0}
.ask{background:var(--green);color:var(--soft);margin:0 calc(-1 * clamp(18px,5vw,72px));padding:clamp(30px,6vw,76px)}.ask .sectionNo,.ask .sectionHead p{color:#bdd0c3}.ask form{display:flex;gap:10px}.ask input{flex:1;max-width:none;border-color:#b9c9bb}.ask button{border:1px solid #bed0bf;color:var(--green);background:#e9e5d6;padding:10px 24px;cursor:pointer}.answer{margin-top:22px;white-space:pre-wrap;max-width:760px;font-size:19px}.sources{font:12px/1.8 ui-sans-serif,system-ui;color:#d5e1d5}.foot{padding:28px 0 70px;color:var(--muted);font:12px/1.7 ui-sans-serif,system-ui}.loading{padding:20vh 0;text-align:center;color:var(--muted)}
@media(max-width:760px){.hero{grid-template-columns:1fr;min-height:auto;padding:70px 0}.seal{display:none}.sectionHead{grid-template-columns:1fr;gap:10px}.stories{grid-template-columns:1fr}.story:nth-child(3n+2){transform:none}.entry{grid-template-columns:85px 1fr auto;gap:8px}.entry button{font-size:18px}.archiveTop{align-items:stretch;flex-direction:column}.ask form{flex-direction:column}}
</style>
</head>
<body><div class="wrap" id="app"><div class="loading">正在打开这份档案…</div></div>
<script>
const id=new URLSearchParams(location.search).get('id')||'';
const make=(tag,cls='',text='')=>{const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=text;return e};
function clean(s){return String(s||'').replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/,'').trim()}
function snippet(s,n=420){s=clean(s).replace(/^###\s+[^\n]+\n/gm,'').trim();return s.length>n?s.slice(0,n)+'…':s}
function section(root,no,title,note){const el=make('section','section'),head=make('div','sectionHead');head.append(make('div','sectionNo',no));const side=make('div');side.append(make('h2','',title),make('p','',note));head.append(side);el.append(head);root.append(el);return el}
async function load(){try{const r=await fetch('/v2/public/memorial?id='+encodeURIComponent(id),{cache:'no-store'}),data=await r.json();if(!r.ok)throw Error(data.error||'无法打开档案');render(data)}catch(e){document.querySelector('#app').textContent=e.message}}
function render(data){document.title=data.title+' · LifeOS';const app=document.querySelector('#app');app.replaceChildren();const top=make('header','top');top.append(make('b','','LIFEOS / 留下的文字'),make('span','','一份由本人选择公开的档案'));app.append(top);
const hero=make('section','hero'),main=make('div');main.append(make('div','eyebrow','A LIFE, IN THEIR OWN WORDS'),make('h1','',data.title),make('div','intro',data.introduction));hero.append(main,make('div','seal','文字\n仍在'));app.append(hero);
const stories=section(app,'01 / SELECTED','想先告诉你的事','从公开日记中挑出的几页。每一页都可以继续读到原文。');const grid=make('div','stories');stories.append(grid);for(const entry of data.stories){const card=make('article','story');card.append(make('time','',entry.date),make('h3','',entry.title||'一页日记'),make('p','',snippet(entry.content,350)));const b=make('button','','阅读原文 ↗');b.onclick=()=>openEntry(entry);card.append(b);grid.append(card)}if(!data.stories.length)grid.append(make('p','', '还没有精选故事。'));
const archive=section(app,'02 / ARCHIVE','完整的公开日记','这是发布时的档案快照。它只包含本人明确选择公开的日记；日后的私人修改不会自动出现在这里。');const tools=make('div','archiveTop'),search=make('input');search.type='search';search.placeholder='按日期、标题或文字寻找';search.setAttribute('aria-label','搜索公开日记');const count=make('span','count');tools.append(search,count);archive.append(tools);const list=make('div');archive.append(list);const reader=make('article','reader');reader.id='reader';reader.hidden=true;archive.append(reader);
window.openEntry=entry=>{reader.replaceChildren(make('time','',entry.date),make('h3','',entry.title||'一页日记'));for(const chunk of clean(entry.content).split(/(?=^###\s+)/m)){const match=chunk.match(/^###\s+([^\n]+)\n?([\s\S]*)/);const body=(match?match[2]:chunk).trim();if(!body)continue;if(match)reader.append(make('h4','',match[1]));reader.append(make('p','',body))}reader.hidden=false;reader.scrollIntoView({behavior:'smooth',block:'start'})};
const all=data.entries||[];let shown=50;const draw=()=>{const q=search.value.trim().toLowerCase(),found=q?all.filter(e=>(e.date+' '+e.title+' '+e.content).toLowerCase().includes(q)):all;list.replaceChildren();count.textContent=found.length+' 页公开日记';for(const entry of found.slice(0,shown)){const row=make('div','entry'),b=make('button','',entry.title||'一页日记');b.onclick=()=>openEntry(entry);row.append(make('time','',entry.date),b,make('span','arrow','↗'));list.append(row)}if(found.length>shown){const more=make('button','','继续看');more.style.cssText='padding:12px 25px;margin-top:22px;border:1px solid var(--green);background:none;color:var(--green);cursor:pointer';more.onclick=()=>{shown+=50;draw()};list.append(more)}};search.oninput=()=>{shown=50;draw()};draw();
const ai=section(app,'03 / AI ECHO','与文字里的我聊聊','这是依据公开日记模拟的 AI 文字分身，可以用第一人称回答并标出出处；它不是本人，也不知道未公开或此刻的想法。');ai.classList.add('ask');if(data.ai_enabled){const form=make('form'),input=make('input');input.placeholder='例如：你曾经在意什么？';input.maxLength=300;input.required=true;const submit=make('button','','提问');form.append(input,submit);ai.append(form);const out=make('div','answer'),sources=make('div','sources');ai.append(out,sources);form.onsubmit=async ev=>{ev.preventDefault();submit.disabled=true;out.textContent='正在阅读公开档案…';sources.textContent='';try{const r=await fetch('/v2/public/memorial/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,question:input.value})}),j=await r.json();if(!r.ok)throw Error(j.error||'暂时无法回答');out.textContent=j.answer;sources.textContent=(j.citations||[]).map((c,i)=>'['+(i+1)+'] '+c.date+' · '+(c.title||'一页日记')).join('\n')}catch(e){out.textContent=e.message}finally{submit.disabled=false}}}else ai.append(make('p','','这份档案暂未开放 AI 提问。'));
app.append(make('footer','foot','LIFEOS · 这份公开档案可以由所有者更新或撤下。二维码指向固定页面，页面内容以最新发布版本为准。'))}
load();
</script></body></html>
