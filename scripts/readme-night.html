<main>
<section id="hero-art" class="art" aria-labelledby="hero-title">
  <div class="scene-grain"></div>
  <div class="hero-copy">
    <div><div class="hero-brand"><span class="brand-mark" aria-hidden="true"></span>LifeOS</div><h1 id="hero-title">坐一会儿。<br>写点今天的事。</h1></div>
    <p class="hero-note">本地日记与个人记忆空间。<br><strong>日记、日程与随手记，<br>放在自己的书桌上。</strong><span class="quiet-meta">本地优先 · AI 可选</span></p>
  </div>
  <div class="screen-desk"><div class="window"><img src="../docs/images/readme/workspace.png" alt="LifeOS 完整落笔界面：日记、日程、摘录、自我探索、体系构建、习惯打卡和桌宠。作者指定原图，完整呈现。" width="1960" height="1308"></div></div>
  <div class="screen-caption"><span>从一页空白开始。书桌可以按自己的习惯重新布置。</span><span>你的文字，你的空间。</span></div>
</section>
<section id="memory-art" class="art" aria-labelledby="memory-title">
  <div class="scene-grain"></div>
  <div class="memory-grid">
    <div class="memory-screen"><div class="window"><img src="../docs/images/readme/journal.png" alt="LifeOS 流年完整阅读界面：左侧日期目录，右侧书本式日记。截图内容为虚构示例。" loading="eager"></div><p class="memory-caption">流年 · 沿日期回到原文。图中日记为虚构示例。</p></div>
    <div class="memory-copy"><span class="eyebrow">留给以后的自己</span><h2 id="memory-title">过一阵子，<br>再读一遍。</h2><p>有时是找一句话，有时只是想看看，那段日子是怎样走过来的。沿日期翻阅，或循关键词，回到当时写下的原文。</p><p class="memory-detail">也可以抽取一页旧日。<br>想再读的地方，留下一枚彩笺。</p></div>
  </div>
  <div class="memory-foot"><span><i></i>日期目录与原文搜索</span><span><i></i>旧页、回声与线索</span><span><i></i>保存你的阅读书签</span></div>
</section>
</main>
<script>
const options = new URLSearchParams(location.search);
document.body.dataset.capture = options.get('capture') || 'hero';
if(options.get('lang') === 'en') {
  document.documentElement.lang = 'en';
  const copy = {
    '#hero-title': 'Stay a while.<br>Write about today.',
    '.hero-note': 'A local-first journal. <br>A space for your memories.<span class="quiet-meta">Your words stay local · AI optional</span>',
    '.memory-copy .eyebrow': 'For your future self',
    '#memory-title': 'Some time later,<br>read it again.',
    '.memory-copy > p:not(.memory-detail)': 'Find a phrase. Return to a day. Read the words you wrote then, or let a memory draw bring an old page back.'
  };
  for(const [selector, html] of Object.entries(copy)) document.querySelector(selector).innerHTML = html;
}
</script>
