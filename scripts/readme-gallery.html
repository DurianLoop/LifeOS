<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeOS · 夜间功能图集</title>
<style>
:root{color-scheme:dark;--paper:#f1ecdf;--muted:#bac6b6;--quiet:#94a48e;--night:#101c16;--edge:#39453a}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:#0b1311;color:var(--paper);font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}h1,h2,p,figure{margin:0}img{display:block;width:100%;height:auto;border-radius:0;filter:none;opacity:1}.panel[hidden]{display:none}
.panel{position:relative;isolation:isolate;overflow:hidden;max-width:1600px;margin:0 auto;background:var(--night)}.panel:before,.panel:after,.grain{position:absolute;inset:0;pointer-events:none;content:"";z-index:-1}.grain{opacity:.034;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.74' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.8' filter='url(%23n)'/%3E%3C/svg%3E")}.panel:after{background:linear-gradient(180deg,transparent 58%,rgba(2,9,5,.38))}.window{position:relative;min-width:0;padding:4px;background:var(--edge);border-radius:8px;box-shadow:0 30px 55px -24px rgba(0,0,0,.9),0 38px 100px rgba(0,0,0,.27);overflow:hidden}.window img{border-radius:0}.copy{position:relative;min-width:0}.feature-name{display:block;color:var(--quiet);font-size:22px;line-height:1.5;letter-spacing:.05em;margin-bottom:27px}.copy h2{font-size:43px;line-height:1.48;font-weight:400;letter-spacing:.015em;margin-bottom:27px;text-wrap:balance}.copy p{font-size:24px;line-height:1.9;color:var(--muted);text-wrap:pretty}.small-note{color:var(--quiet);font-size:21px;line-height:1.85}.copy .small-note{font-size:21px;color:var(--quiet);margin-top:31px}.soft-dot{display:inline-block;height:4px;width:4px;border-radius:50%;background:#a8b39b;vertical-align:middle;margin:0 13px 3px}
#draw-art{padding:76px 72px 80px;background:linear-gradient(120deg,#182820,#15231b 72%,#121e18)}#draw-art:before{background:linear-gradient(126deg,rgba(225,208,164,.09),rgba(225,208,164,.025) 38%,transparent 67%)}.draw-layout{display:grid;grid-template-columns:minmax(0,2.62fr) minmax(0,1fr);align-items:center;gap:66px}.draw-copy{padding:10px 0 15px}.draw-copy .small-note{margin-top:40px;padding-top:23px;border-top:1px solid rgba(180,197,168,.17)}
#letters-art{padding:68px 92px 78px;background:linear-gradient(133deg,#18251d,#243128 60%,#18261e)}#letters-art:before{background:linear-gradient(112deg,transparent 35%,rgba(225,210,172,.035) 47%,rgba(225,210,172,.10) 65%,transparent 89%)}.letters-head{display:grid;grid-template-columns:1fr 1.07fr;align-items:end;gap:75px;margin-bottom:42px}.letters-head .feature-name{margin-bottom:15px;font-size:21px}.letters-head h2{font-size:41px;margin-bottom:0}.letters-head p{font-size:24px;line-height:1.75;max-width:650px;padding-bottom:4px}.letters-head p span{display:block;color:#95a88e;font-size:21px;margin-top:11px}.letters-window{max-width:1416px;margin:0 auto}
#companion-art{padding:78px 70px 78px 92px;background:linear-gradient(113deg,#101c15,#192a1e 64%,#1d2b20)}#companion-art:before{background:linear-gradient(137deg,transparent 30%,rgba(205,190,146,.075) 62%,transparent 89%)}.companion-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.65fr);align-items:center;gap:76px}.companion-copy h2{font-size:42px}.companion-copy .small-note{margin-top:30px}.companion-copy .sound-note{display:flex;align-items:center;gap:14px;margin-top:34px;color:#a2b498;font-size:21px;line-height:1.7}.sound-mark{display:flex;align-items:center;gap:5px;height:21px;flex:none}.sound-mark i{display:block;width:2px;background:#94aa88;border-radius:2px}.sound-mark i:nth-child(1){height:8px}.sound-mark i:nth-child(2){height:17px}.sound-mark i:nth-child(3){height:11px}.sound-mark i:nth-child(4){height:21px}.sound-mark i:nth-child(5){height:7px}
html[lang="en"] .copy h2{letter-spacing:0;font-size:42px;line-height:1.4}html[lang="en"] .feature-name{letter-spacing:.025em}html[lang="en"] .copy p{font-size:23px;line-height:1.85}html[lang="en"] .copy .small-note{font-size:21px}html[lang="en"] .letters-head h2{font-size:42px}html[lang="en"] .letters-head p{font-size:23px}
@media(max-width:1050px) and (min-width:641px){#draw-art{padding:50px 42px}.draw-layout{gap:36px;grid-template-columns:2.3fr 1fr}.feature-name{font-size:16px;margin-bottom:19px}.copy h2,.companion-copy h2,html[lang="en"] .copy h2{font-size:30px}.copy p,html[lang="en"] .copy p{font-size:17px}.copy .small-note,html[lang="en"] .copy .small-note{font-size:15px;margin-top:22px}.draw-copy .small-note{padding-top:19px}#letters-art{padding:46px 52px 55px}.letters-head{gap:40px;margin-bottom:30px}.letters-head h2,html[lang="en"] .letters-head h2{font-size:31px}.letters-head .feature-name{font-size:16px}.letters-head p,html[lang="en"] .letters-head p{font-size:17px}.letters-head p span{font-size:15px}#companion-art{padding:52px}.companion-layout{gap:41px;grid-template-columns:1fr 2.3fr}.companion-copy .sound-note{font-size:15px;gap:10px}}
@media(max-width:640px){.window{padding:3px;border-radius:5px;box-shadow:0 17px 28px -17px rgba(0,0,0,.95),0 23px 44px rgba(0,0,0,.24)}.feature-name{font-size:12px;line-height:1.6;letter-spacing:.04em;margin-bottom:12px}.copy h2,.companion-copy h2,html[lang="en"] .copy h2{font-size:27px;line-height:1.5;letter-spacing:.005em;margin-bottom:16px;text-wrap:pretty}.copy p,html[lang="en"] .copy p{font-size:14px;line-height:1.9}.copy .small-note,html[lang="en"] .copy .small-note{font-size:12px;margin-top:18px}.copy h2 br{display:none}.soft-dot{width:3px;height:3px;margin:0 8px 2px}#draw-art{padding:31px 12px 30px}.draw-layout{display:flex;flex-direction:column;gap:24px;align-items:stretch}.draw-copy{order:-1;padding:0 10px}.draw-copy .small-note{margin-top:16px;padding-top:0;border:0}.draw-copy p:not(.small-note){max-width:340px}.draw-layout figure{width:100%}#letters-art{padding:31px 12px 30px}.letters-head{display:block;margin:0 10px 23px}.letters-head .feature-name{font-size:12px;margin-bottom:12px}.letters-head h2,html[lang="en"] .letters-head h2{font-size:27px;margin-bottom:14px}.letters-head p,html[lang="en"] .letters-head p{font-size:14px;line-height:1.9;padding:0}.letters-head p span{font-size:12px;line-height:1.8;margin-top:10px}#companion-art{padding:32px 12px 30px}.companion-layout{display:flex;flex-direction:column;gap:23px;align-items:stretch}.companion-copy{padding:0 10px}.companion-copy h2 br{display:none}.companion-copy .small-note{display:none}.companion-copy .sound-note{font-size:12px;line-height:1.8;margin-top:16px;gap:10px}.sound-mark{transform:scale(.8);transform-origin:left center;margin-right:-4px}.companion-layout figure{width:100%}}
</style>
</head>
<body>
<main>
<section id="draw-art" class="panel" data-panel="draw" aria-labelledby="draw-title">
  <div class="grain" aria-hidden="true"></div>
  <div class="draw-layout">
    <figure class="window"><img src="../docs/images/readme/memory.png" alt="LifeOS 记忆抽签机完整界面，展示旧页、回声、线索和原文入口；截图日记为虚构示例。"></figure>
    <div class="copy draw-copy"><span class="feature-name" data-copy="draw-name">记忆抽签</span><h2 id="draw-title" data-copy="draw-title">抽一页旧日。</h2><p data-copy="draw-body">不必先想起关键词。<br>让过去的一页，<br>偶然回到眼前。</p><p class="small-note" data-copy="draw-note">旧页<span class="soft-dot" aria-hidden="true"></span>回声<span class="soft-dot" aria-hidden="true"></span>线索<br>从抽签结果，回到原文。</p></div>
  </div>
</section>
<section id="letters-art" class="panel" data-panel="letters" aria-labelledby="letters-title">
  <div class="grain" aria-hidden="true"></div>
  <div class="copy letters-head"><div><span class="feature-name" data-copy="letters-name">漂流瓶</span><h2 id="letters-title" data-copy="letters-title">写给未来的自己。</h2></div><p data-copy="letters-body">封存一段文字、声音或影像，<br>约定某一天，再打开。<span>内容保存在本机，随工作区一起备份。</span></p></div>
  <figure class="window letters-window"><img src="../docs/images/readme/bottles.png" alt="LifeOS 漂流瓶完整界面，展示三封待开启的未来来信；来信为虚构示例。"></figure>
</section>
<section id="companion-art" class="panel" data-panel="companion" aria-labelledby="companion-title">
  <div class="grain" aria-hidden="true"></div>
  <div class="companion-layout">
    <div class="copy companion-copy"><span class="feature-name" data-copy="companion-name">灵犀 · 桌宠与陪伴</span><h2 id="companion-title" data-copy="companion-title">桌旁有个<br>小伙伴。</h2><p data-copy="companion-body">让 ViVi 等角色待在应用里，<br>或住进桌面的一角。</p><p class="small-note" data-copy="companion-note">选一个喜欢的角色，<br>按自己的习惯安排陪伴。</p><div class="sound-note"><span class="sound-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span data-copy="companion-sound">还有六段可离线播放的自然声。</span></div></div>
    <figure class="window"><img src="../docs/images/readme/companion.png" alt="LifeOS 灵犀完整界面，展示 ViVi、已安装角色与宠物库；第三方角色保留原作者许可。"></figure>
  </div>
</section>
</main>
<script>
const options = new URLSearchParams(location.search);
const selection = options.get('capture');
const panels = ['draw', 'letters', 'companion'];
if (panels.includes(selection)) {
  document.body.dataset.capture = selection;
  for (const panel of document.querySelectorAll('[data-panel]')) panel.hidden = panel.dataset.panel !== selection;
}
if (options.get('lang') === 'en') {
  document.documentElement.lang = 'en';
  document.title = 'LifeOS · A quiet gallery';
  const copy = {
    'draw-name': 'Memory draws',
    'draw-title': 'Let an old page find you.',
    'draw-body': 'No search phrase needed.<br>A page from your past<br>can return by chance.',
    'draw-note': 'Old pages · Echoes · Clues<br>Open the original from any result.',
    'letters-name': 'Letters to your future self',
    'letters-title': 'Open it another day.',
    'letters-body': 'Keep a note, a voice recording or a video.<br>Choose a day to open it.<span>Stored locally, and included in your workspace backup.</span>',
    'companion-name': 'Desktop companions',
    'companion-title': 'A little company <br>at your desk.',
    'companion-body': 'Keep ViVi and other characters<br>in the app or on your desktop.',
    'companion-note': 'Choose a character you like,<br>and make a little space for them.',
    'companion-sound': 'Six nature soundscapes, available offline.'
  };
  for (const element of document.querySelectorAll('[data-copy]')) element.innerHTML = copy[element.dataset.copy];
  const descriptions = [
    'The complete LifeOS memory draw interface, with Old pages, Echoes, Clues and a link to the original. The journal entry is fictional.',
    'The complete LifeOS future letters interface, showing three letters waiting to be opened. The letters are fictional.',
    'The complete LifeOS companion interface, showing ViVi, installed characters and the pet library. Third-party characters retain their authors’ licenses.'
  ];
  document.querySelectorAll('img').forEach((image, index) => image.alt = descriptions[index]);
}
</script>
</body>
</html>
