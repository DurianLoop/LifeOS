<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeOS · Web Companion</title><style>
:root{--paper:#f4efe7;--ink:#27231f;--muted:#756d65;--line:#cfc5b9;--accent:#665b78}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-serif,"Songti SC","Noto Serif CJK SC",serif}main{max-width:980px;margin:auto;padding:40px 22px 90px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:22px}.top h1{font-size:clamp(32px,6vw,64px);font-weight:400;margin:0}.small{color:var(--muted);font:13px/1.6 ui-sans-serif,system-ui}.panel{border-top:1px solid var(--line);margin-top:32px;padding-top:22px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,textarea,button{font:inherit;border:1px solid var(--line);background:rgba(255,255,255,.42);color:inherit;padding:12px 14px;min-height:44px}input{flex:1;min-width:220px}button{cursor:pointer}button.primary{background:var(--ink);color:var(--paper)}textarea{width:100%;min-height:320px;line-height:1.8}.entries{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}.entry{background:var(--paper);padding:18px;border:0;text-align:left;min-height:116px}.entry b{display:block;font-size:20px;font-weight:400;margin-bottom:8px}.entry.locked{background:rgba(102,91,120,.045)}.entry .lock{display:inline-block;margin-top:8px;font:10px/1 ui-sans-serif,system-ui;letter-spacing:.12em;color:var(--accent)}.hidden{display:none!important}.status{margin:14px 0;color:var(--muted);font:12px/1.6 ui-sans-serif,system-ui}.security{margin-top:12px;padding:14px;border-left:2px solid var(--accent);background:rgba(102,91,120,.045)}.security input{min-width:min(420px,100%)}@media(max-width:600px){main{padding:24px 16px 80px}.top{align-items:start;flex-direction:column}.row>*{width:100%}.row button{width:auto}.security input{width:100%}}
</style></head><body><main><header class="top"><div><div class="small">LIFEOS / WEB COMPANION</div><h1>随时写下一页。</h1></div><div class="small">同步层的轻量 Web 入口<br>高级探索仍留在 Desktop</div></header>
<section id="auth" class="panel"><div class="row"><input id="email" type="email" placeholder="邮箱"><input id="pw" type="password" placeholder="密码（8+）"><button id="login" class="primary">登录</button><button id="register">注册</button></div><div id="authStatus" class="status"></div></section>
<section id="app" class="hidden"><div class="panel"><div class="row"><button id="new" class="primary">写今天</button><button id="refresh">刷新</button><button id="logout">退出</button></div><div class="security"><div class="small">端到端加密 · 可选</div><div class="row"><input id="recoveryKey" type="password" autocomplete="off" placeholder="Desktop 导出的 LIFEOS-RK1-… Recovery Key"><button id="saveKey">保存在此浏览器</button><button id="forgetKey">忘记密钥</button></div><div id="keyStatus" class="status"></div></div></div><section class="panel"><div class="small">CLOUD JOURNAL</div><div id="entries" class="entries"></div></section></section>
<section id="editor" class="panel hidden"><div class="row"><input id="date" type="date"><input id="title" placeholder="标题（可选）"></div><p><textarea id="content" placeholder="今天发生了什么？"></textarea></p><div class="row"><button id="save" class="primary">保存新版本</button><button id="cancel">取消</button></div><div id="saveStatus" class="status"></div></section>
</main><script>
let token=localStorage.lifeosCloudToken||'',items=[],editing=null;const $=s=>document.querySelector(s);const id=p=>p+'_'+crypto.randomUUID().replaceAll('-','');
async function req(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});const j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);return j}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function plain(raw=''){const m=raw.match(/### 日记\s*\n([\s\S]*?)(?=\n### |$)/);return m?m[1].trim():raw}
function recoveryRaw(){const t=localStorage.lifeosWebRecoveryKey||'';if(!t.startsWith('LIFEOS-RK1-'))return null;let s=t.split('-',3)[2],pad='='.repeat((4-s.length%4)%4);return Uint8Array.from(atob((s+pad).replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))}
function b64u(a){let s=btoa(String.fromCharCode(...new Uint8Array(a)));return s.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function fromB64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function encryptPayload(payload,aad){const raw=recoveryRaw();if(!raw)return null;const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt']);const nonce=crypto.getRandomValues(new Uint8Array(12)),enc=new TextEncoder(),additionalData=enc.encode(JSON.stringify(aad,Object.keys(aad).sort()));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:nonce,additionalData},key,enc.encode(JSON.stringify(payload)));return {v:1,alg:'A256GCM',nonce:b64u(nonce),ciphertext:b64u(ct),aad}}
async function decryptEnvelope(env){const raw=recoveryRaw();if(!raw)throw Error('这页已端到端加密。请先在上方输入 Recovery Key。');const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const aad=env.aad||{},additionalData=new TextEncoder().encode(JSON.stringify(aad,Object.keys(aad).sort()));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64u(env.nonce),additionalData},key,fromB64u(env.ciphertext));return JSON.parse(new TextDecoder().decode(pt))}
async function normalizeEntry(x){const env=x.encrypted_payload?.encrypted_envelope;if(!env)return x;try{const p=await decryptEnvelope(env);return {...p,current_revision_id:x.current_revision_id||p.revision?.revision_id,_encrypted:true}}catch(e){return {locked:true,entry:{entry_id:x.entry_id,journal_date:'加密页',title:'需要 Recovery Key'},current_revision_id:x.current_revision_id,lockError:e.message,_raw:x}}}
function updateKeyStatus(){const on=!!recoveryRaw();$('#keyStatus').textContent=on?'这台浏览器已持有 Recovery Key；加密页会在本机解密，新写入也会先加密。':'当前没有 Recovery Key；普通 TLS 数据仍可使用，加密页只显示锁定状态。'}
function show(){ $('#auth').classList.toggle('hidden',!!token);$('#app').classList.toggle('hidden',!token);if(token){updateKeyStatus();load()}}
async function auth(kind){try{const j=await req('/v1/'+kind,{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#pw').value})});token=j.token;localStorage.lifeosCloudToken=token;$('#authStatus').textContent='已登录。';show()}catch(e){$('#authStatus').textContent=e.message}}
$('#login').onclick=()=>auth('login');$('#register').onclick=()=>auth('register');$('#logout').onclick=()=>{token='';delete localStorage.lifeosCloudToken;show()};$('#refresh').onclick=load;
$('#saveKey').onclick=()=>{const k=$('#recoveryKey').value.trim();if(!k.startsWith('LIFEOS-RK1-'))return $('#keyStatus').textContent='Recovery Key 格式不正确。';localStorage.lifeosWebRecoveryKey=k;$('#recoveryKey').value='';updateKeyStatus();load()};$('#forgetKey').onclick=()=>{delete localStorage.lifeosWebRecoveryKey;$('#recoveryKey').value='';updateKeyStatus();load()};
async function load(){try{const d=await req('/v1/entries'),raw=d.items||[];items=[];for(const x of raw){items.push(await normalizeEntry(x))}$('#entries').innerHTML=items.map((x,i)=>`<button class="entry ${x.locked?'locked':''}" data-i="${i}"><b>${esc(x.entry?.journal_date||'未定日期')}</b><span class="small">${esc(x.entry?.title||'一页日记')}<br>${esc(x.locked?x.lockError:plain(x.content||'').slice(0,80))}</span>${x.locked?'<span class="lock">LOCKED · E2EE</span>':''}</button>`).join('')||'<div class="entry">云端还没有日记。</div>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>open(items[+b.dataset.i]))}catch(e){if(/unauthorized/i.test(e.message)){token='';delete localStorage.lifeosCloudToken;show()}else $('#entries').innerHTML='<div class="entry">'+esc(e.message)+'</div>'}}
function open(x){if(x?.locked){$('#keyStatus').textContent=x.lockError;$('#recoveryKey').focus();return}editing=x||null;const d=x?.entry?.journal_date||new Date().toISOString().slice(0,10);$('#date').value=d;$('#title').value=x?.entry?.title||'';$('#content').value=plain(x?.content||'');$('#saveStatus').textContent='';$('#editor').classList.remove('hidden');$('#editor').scrollIntoView({behavior:'smooth'})}
$('#new').onclick=()=>open(null);$('#cancel').onclick=()=>$('#editor').classList.add('hidden');
$('#save').onclick=async()=>{try{const date=$('#date').value,text=$('#content').value,title=$('#title').value;if(!date||!text.trim())throw Error('日期和正文必填');const eid=editing?.entry?.entry_id||id('entry'),base=editing?.current_revision_id||editing?.revision?.revision_id||null,rid=id('rev');const raw=`---\nlifeos_entry_id: ${eid}\n${title?`title: ${title}\n`:''}---\n\n### 日程\n\n### 日记\n${text.trim()}\n\n### 自我探索\n\n### 心得与摘录\n\n### 体系构建\n\n### 习惯打卡\n`;const op={operation_id:id('op'),entry_id:eid,revision_id:rid,base_revision_id:base,op_type:'upsert',device_id:'web',created_at:new Date().toISOString()};const payload={entry:{entry_id:eid,kind:'daily',journal_date:date,title,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,tags_json:'[]',source_path:`memories/daily/${date.slice(0,4)}/${date}.md`,source_format:'markdown'},revision:{revision_id:rid,parent_revision_id:base,content_hash:'web'},content:raw};const aad={operation_id:op.operation_id,entry_id:eid,revision_id:rid,base_revision_id:base,op_type:'upsert'},env=await encryptPayload(payload,aad);op.payload=env?{encrypted_envelope:env}:payload;const d=await req('/v1/push',{method:'POST',body:JSON.stringify({operations:[op]})});if(d.conflicts?.length)throw Error('这页在另一台设备上已经更新，请刷新后比较。');$('#saveStatus').textContent=env?'已在浏览器中端到端加密并保存。':'已保存为新版本。';$('#editor').classList.add('hidden');editing=null;await load()}catch(e){$('#saveStatus').textContent=e.message}}
show();
</script></body></html>
